[project]
name = "eclipsis-ai"
version = "0.1.0"
description = "Reengineering of ECLIPSIS AI assistant"
requires-python = ">=3.13,<3.15"
readme = "README.md"

dependencies = [
    "pyside6==6.10.2",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "anyio>=4.3.0",
    "httpx>=0.27.0",
    "python-dotenv==1.0.1",
    "orjson==3.10.0",
    "tinydb==4.8.0",
    "loguru==0.7.2",
    "feedparser==6.0.11",
    "requests==2.31.0",
    "markdown==3.6",
    "pytest==8.2.0",
    "pytest-asyncio==0.23.5",
    "mypy==2.3.0",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
