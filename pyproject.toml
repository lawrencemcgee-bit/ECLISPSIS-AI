[project]
name = "eclipsis-ai"
version = "0.1.0"
description = "Reengineering of ECLIPSIS AI assistant"
requires-python = ">=3.13,<3.15"
readme = "README.md"

dependencies = [
    "pyside6==6.10.2",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "anyio>=4.3.0",
    "httpx>=0.27.0",
    "python-dotenv==1.0.1",
    "orjson==3.11.9",
    "tinydb==4.8.0",
    "loguru==0.7.2",
    "feedparser==6.0.11",
    "requests==2.34.2",
    "markdown==3.6",
    "pytest==8.2.0",
    "pytest-asyncio==0.23.5",
    "mypy==2.3.0",
    "ruff>=0.15",
    "psutil>=6.0.0",
    # Flet UI (proposed migration from PySide6/QML — see
    # docs/flet_migration_assessment.md). pyside6 above is left in place;
    # this is additive until a cutover decision is made.
    "flet==0.86.1",
    # flet-cli provides the `flet build`/`flet doctor` commands used for
    # packaging — see docs/flet_packaging.md. Not needed to just run the
    # app (flet_run.py), only to package it.
    "flet-cli==0.86.1",
    # Real voice I/O (see docs/voice_io_assessment.md). Both optional at
    # runtime with graceful fallback — sounddevice/numpy above are also
    # needed for real mic capture specifically.
    "vosk>=0.3.45",
    "pyttsx3>=2.90",
    # Real vision capture (Tier 3 — see src/services/vision_service.py).
    # Optional at runtime with graceful fallback to the original
    # simulated placeholder, same pattern as sounddevice/vosk above.
    "opencv-python-headless>=4.9",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
